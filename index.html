<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dosresan • Hopp-prototyp</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10192d;color:#eef7ff;font:16px system-ui}main{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;color:#73ecd9;letter-spacing:2px}h1{font-size:23px}header span{font-size:13px;color:#a9bdd6}.question{border-left:4px solid #6debd1;background:#1b2b46;padding:18px 24px;margin:15px 0}h2{font-size:20px;margin:0 0 8px}p{margin:6px 0;line-height:1.5}canvas{display:block;width:100%;border:2px solid #355271;border-radius:8px;background:#16253b}#feedback{min-height:65px;padding:12px 0;color:#ffdd87}button{font:inherit;color:white;background:#284365;border:1px solid #58779b;border-radius:8px;padding:12px 20px;cursor:pointer;touch-action:none}button:focus-visible{outline:3px solid #ffda72}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.controls span{margin-left:auto;color:#b0c3d9;font-size:14px}.help{font-size:14px;color:#acbed1;margin-top:20px}#reset{margin-left:auto} @media(max-width:600px){main{padding:12px}.controls span{width:100%;margin:0}h1{font-size:18px}.question{padding:12px}header{letter-spacing:0}}</style>
<main><header><h1>✚ DOSRESAN / HOPP</h1><span>PROVBANA · 3 UPPGIFTER</span></header><section class="question"><h2 id="heading"></h2><p id="question"></p></section><canvas id="game" width="1000" height="450" tabindex="0" aria-label="Plattformsspel. Styr med piltangenter och hoppa med mellanslag. Plattformarnas svar finns även nedanför."></canvas><div id="feedback" role="status" aria-live="polite">Räkna ut svaret och landa ovanpå rätt plattform.</div><div class="controls"><button id="left" aria-label="Gå vänster">◀</button><button id="right" aria-label="Gå höger">▶</button><button id="jump">Hoppa ↑</button><button id="reset">Börja om ↻</button><span>← → förflytta · Mellanslag hoppa</span></div><p class="help" id="answers"></p><p class="help">Fiktiva övningsuppgifter. Ingen tidspress. Ett missat hopp kostar ingenting. Fel svarsplattform ger en ny fråga på samma nivå.</p></main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const keys={left:false,right:false};let stage=0,attempt=0,question,platforms=[],locked=false,won=false,clock=0,transition=0,last=0,particles=[];
const player={x:70,y:350,w:28,h:48,vx:0,vy:0,grounded:true};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestion(){const n=2+Math.floor(Math.random()*4)+attempt%3; if(stage===0)return {text:`Ordinerad dos är ${n*100} mg. Styrkan är 100 mg/ml. Vilken volym motsvarar dosen?`,answer:n,options:[n,n*2,n/2],unit:'ml',solution:`${n*100} ÷ 100 = ${n} ml.`};if(stage===1)return {text:`Ordinerad dos är ${n*50} mg. Varje tablett innehåller 50 mg. Hur många tabletter behövs?`,answer:n,options:[n,n+2,n-1],unit:'tabletter',solution:`${n*50} ÷ 50 = ${n} tabletter.`};return {text:`Ordinerad dos är ${n*10+5} mg. Styrkan är 10 mg/ml. Vilken volym motsvarar dosen?`,answer:n+.5,options:[n+.5,(n+.5)*10,n],unit:'ml',solution:`${n*10+5} ÷ 10 = ${String(n+.5).replace('.',',')} ml.`}}
function spawn(){Object.assign(player,{x:70,y:350,vx:0,vy:0,grounded:true});keys.left=keys.right=false}
function load(){question=makeQuestion();platforms=shuffle(question.options.slice()).map((value,i)=>({x:230+i*250,y:280,w:170,h:20,value,state:''}));$('heading').textContent=`Medicin- och kirurgavdelningen · Uppgift ${stage+1} av 3`;$('question').textContent=question.text;$('answers').textContent='Plattformar från vänster: '+platforms.map(p=>`${String(p.value).replace('.',',')} ${question.unit}`).join(' · ');locked=false;spawn()}
function reset(){stage=attempt=0;won=false;particles=[];transition=0;$('feedback').textContent='Räkna ut svaret och landa ovanpå rätt plattform.';load()}
function jump(){if(!locked&&!won&&player.grounded){player.vy=-660;player.grounded=false}}
function choose(p){locked=true;player.vx=0;const correct=p.value===question.answer;p.state=correct?'right':'wrong';$('feedback').textContent=(correct?'Rätt! ':'Inte riktigt. ')+question.solution+(correct?' Nästa del öppnas…':' Du får en ny fråga på samma nivå.');transition=clock+(correct?2.3:4);if(correct){for(let i=0;i<25;i++)particles.push({x:player.x+14,y:player.y,vx:(Math.random()-.5)*260,vy:-Math.random()*230,life:1.5})}else{attempt++}locked=correct?'right':'wrong'}
function update(dt){clock+=dt;if(locked&&clock>=transition){if(locked==='right'){stage++;if(stage===3){won=true;locked=false;$('heading').textContent='Provbanan klar!';$('question').textContent='Du har räknat och hoppat dig igenom alla tre uppgifter.';$('feedback').textContent='Snyggt! Dörren är öppen. Tryck Börja om för en ny omgång.';return}}load()}
if(!locked&&!won){player.vx=(Number(keys.right)-Number(keys.left))*280;player.x=Math.max(0,Math.min(972,player.x+player.vx*dt));const bottom=player.y+player.h;player.vy+=1550*dt;player.y+=player.vy*dt;player.grounded=false;
if(player.vy>=0){for(const p of platforms){if(bottom<=p.y&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){player.y=p.y-player.h;player.vy=0;player.grounded=true;choose(p);break}}}if(!locked&&player.y+player.h>=398){player.y=350;player.vy=0;player.grounded=true}}
for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt}particles=particles.filter(p=>p.life>0)}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function draw(){ctx.clearRect(0,0,1000,450);rect(0,0,1000,450,'#15263e');for(let x=0;x<1000;x+=80){rect(x,0,2,398,'#203550')}for(let x=40;x<900;x+=300){rect(x,35,180,9,'#3d7b89');rect(x+25,60,120,86,'#294966');rect(x+31,66,108,74,'#17324c');rect(x+82,66,5,74,'#4e7891');rect(x+31,101,108,5,'#4e7891')}
rect(935,180,60,218,won?'#53cdb1':'#2d5364');ctx.fillStyle='#d3fbea';ctx.font='12px system-ui';ctx.fillText('UTGÅNG',937,172);rect(0,398,1000,52,'#345267');rect(0,398,1000,5,'#79b3b4');for(let x=0;x<1000;x+=40)rect(x,420,36,2,'#213b52');
for(const p of platforms){const color=p.state==='right'?'#64e4a8':p.state==='wrong'?'#f38486':'#6bcae8';rect(p.x,p.y,p.w,7,color);rect(p.x+5,p.y+7,p.w-10,14,'#355d7b');ctx.fillStyle='#f3faff';ctx.textAlign='center';ctx.font='bold 20px system-ui';ctx.fillText(`${String(p.value).replace('.',',')} ${question.unit}`,p.x+p.w/2,p.y-15);ctx.textAlign='left'}
ctx.save();ctx.translate(player.x+14,player.y+24);if(locked==='wrong')ctx.rotate(Math.sin(clock*15)*.22);const walk=player.grounded&&Math.abs(player.vx)>0?Math.sin(clock*15)*3:0;rect(-11,7,8,17+walk,'#b5e8ff');rect(3,7,8,17-walk,'#b5e8ff');rect(-14,21+walk,12,5,'#19314c');rect(3,21-walk,12,5,'#19314c');rect(-14,-9,28,23,'#3bacc2');rect(-18,-6,5,18,'#eac29c');rect(13,-6,5,18,'#eac29c');rect(-10,-25,20,19,'#eac29c');rect(-12,-28,24,8,'#213a54');rect(3,-18,4,4,'#23324a');rect(3,-4,7,9,'#fff2c7');ctx.restore();
for(const p of particles)rect(p.x,p.y,5,5,'#ffe183');ctx.fillStyle='#bcd3e8';ctx.font='14px system-ui';ctx.fillText('Säker gångväg — hoppa upp till ditt svar',24,443);if(won){rect(270,100,460,95,'#142b45');ctx.fillStyle='#7af2c5';ctx.font='bold 30px system-ui';ctx.textAlign='center';ctx.fillText('BANA AVKLARAD!',500,155);ctx.textAlign='left'}}
function frame(t){const dt=Math.min((t-last)/1000||0,.025);last=t;update(dt);draw();requestAnimationFrame(frame)}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','ArrowUp'].includes(e.code)&&e.target.tagName!=='BUTTON'){e.preventDefault();if(e.code==='ArrowLeft')keys.left=true;if(e.code==='ArrowRight')keys.right=true;if((e.code==='Space'||e.code==='ArrowUp')&&!e.repeat)jump()}});document.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.left=false;if(e.code==='ArrowRight')keys.right=false});window.addEventListener('blur',()=>{keys.left=keys.right=false});
for(const name of ['left','right']){$(name).addEventListener('pointerdown',e=>{e.preventDefault();$(name).setPointerCapture(e.pointerId);keys[name]=true});for(const event of ['pointerup','pointercancel','lostpointercapture'])$(name).addEventListener(event,()=>keys[name]=false)}$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('jump').addEventListener('click',e=>{if(e.detail===0)jump()});$('reset').addEventListener('click',()=>{reset();canvas.focus()});reset();requestAnimationFrame(frame);
</script><script src="upgrade.js"></script><script src="journey.js"></script><script src="arcade.js"></script><style>
body{background:radial-gradient(ellipse at top,#1c3951,#0a1426 75%)}main{max-width:1100px}header{border-bottom:1px solid #39516b}canvas{border:1px solid #42637c;box-shadow:0 18px 65px #0006;border-radius:12px;image-rendering:pixelated}.question{border-radius:0 12px 12px 0;background:linear-gradient(110deg,#203b52,#182940);box-shadow:0 8px 25px #0002}button{box-shadow:0 3px 0 #08172a}button:active{transform:translateY(2px);box-shadow:none}.audio-bar{display:flex;gap:8px;align-items:center;margin:16px 0}.audio-bar button{font-size:14px;padding:8px 12px}.audio-bar span{margin-left:auto;font-size:14px;color:#9cb9cc}details{padding:18px;border:1px solid #355069;border-radius:12px;color:#adcad7;margin-top:22px}summary{cursor:pointer;color:#85e5d3}details h3{color:#ecf7ff;font-size:16px}details p{font-size:14px}@media(max-width:600px){.audio-bar{flex-wrap:wrap}.audio-bar span{width:100%;margin:5px 0}}
</style><style>
/* Keep the complete exercise readable while the game fits the available height. */
html{scroll-padding-top:12px}
.question{position:sticky;top:0;z-index:10;height:auto;max-height:none;overflow:visible;margin:10px 0;padding:14px 18px;background:#1b3048;border:1px solid #486681;border-left:4px solid #6debd1;box-shadow:0 8px 18px #0005}
#heading{font-size:clamp(16px,2vw,20px);line-height:1.35;overflow-wrap:anywhere}
#question{font-size:clamp(16px,1.8vw,18px);line-height:1.55;white-space:normal;overflow-wrap:anywhere}
#game{margin-inline:auto;width:var(--game-width,100%);max-width:100%;height:auto}
.audio-bar{margin:8px 0}#feedback{min-height:48px;padding:8px 0}
@media(max-height:700px){main{padding-top:8px}header h1{margin:8px 0}.question{padding:10px 14px}.audio-bar span{display:none}}
</style><script>
(()=>{
 const panel=document.querySelector('.question'),game=document.getElementById('game');
 function fitGame(){
   const main=document.querySelector('main'),header=document.querySelector('header'),audio=document.querySelector('.audio-bar'),controls=document.querySelector('.controls');
   const viewport=window.visualViewport?window.visualViewport.height:window.innerHeight;
   const available=viewport-panel.getBoundingClientRect().height-header.getBoundingClientRect().height-audio.getBoundingClientRect().height-controls.getBoundingClientRect().height-110;
   // Preserve usable platform labels even when the screen needs vertical scrolling.
   const width=Math.min(main.clientWidth-24,Math.max(360,available*1000/450));
   game.style.setProperty('--game-width',Math.max(240,width)+'px');
 }
 if(typeof ResizeObserver!=='undefined'){const observer=new ResizeObserver(fitGame);observer.observe(panel);observer.observe(document.querySelector('.controls'));}
 window.addEventListener('resize',fitGame);window.visualViewport?.addEventListener('resize',fitGame);fitGame();
})();
</script></html>
